<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Event Ticket</title>
        <link rel="icon" href="favicon.ico">
        <link href="eventticket.css" rel="stylesheet">
        <script defer src="eventticket.js"></script>
    </head>
    <body>
        <main class="wrapper">
            <h1>Event Ticket</h1>
            <form id="eventticket">
                <div class="field">
                    <label for="firstname">First Name</label>
                    <input id="firstname" name="firstname" type="text" required />
                </div>
                <div class="field">
                    <label for="lastname">Last Name</label>
                    <input id="lastname" name="lastname" type="text" required />
                </div>
                <div class="field full">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required />
                </div>
                <div class="field">
                    <label for="eventtype">Type</label>
                    <select id="eventtype" name="eventtype" aria-controls="notesContainer" required>
                        <option value="">Choose one</option>
                        <option value="student">Student</option>
                        <option value="guest">Guest</option>
                    </select>
                </div>
                <div class="field">
                    <label for="eventdate">Event Date</label>
                    <input id="eventdate" name="eventdate" type="date" required />
                </div>
                <div id="studentContainer" class="field full" hidden>
                    <label for="studentId">Student Id</label>
                    <input id="studentId" name="studentId" type="text" />
                </div>
                <div id="accessContainer" class="field full" hidden>
                    <label for="accesscode">Access Code</label>
                    <input id="accesscode" name="accesscode" type="text" />
                </div>
                <button class="full" type="submit">Create Ticket</button>
            </form>
            <section id="output" aria-live="polite"></section>
        </main>
    </body>
</html>
